<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veritas Literário</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<meta name="description" content="Sistema de avaliação literária — concursos, submissões e rankings com critérios profissionais.">
<meta property="og:title" content="Veritas Literário">
<meta property="og:description" content="Sistema de avaliação literária — concursos, submissões e rankings com critérios profissionais.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#c9a84c">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600&family=Source+Sans+3:wght@300;400;600&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:wght@400;700&display=swap');
/*... todo CSS original ...*/
#page-avaliar, .eval-section, .review-card { font-size: 110%; }
</style>
<!-- Firebase SDK v8 — expõe firebase globalmente de forma síncrona -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
//... código do Firebase original ...
</script>
</head>
<body>
<div id="customBgLayer"></div>
<!--... SEU HTML ORIGINAL ...-->

<!-- Novos recursos para avaliação -->
<!-- Nota final do admin -->
<div id="adminFinalScoreBox" class="eval-section hidden" style="max-width:440px;margin:36px auto 0;">
  <div class="eval-section-header">
    <span class="eval-section-title">Nota Final do Administrador</span>
    <input type="number" min="0" max="10" step="0.1" id="adminFinalScoreInput" style="width:80px;font-size:25px;">
    <button class="btn btn-primary btn-sm" onclick="salvaNotaFinalAdmin()">Salvar</button>
  </div>
  <div style="font-size:16px;color:var(--gold3);margin-top:8px">
    Só utilize se não houver notas dos juízes. <br>Esta nota será considerada final!
  </div>
</div>
<!-- Excluir nota de juiz exemplo -->
<div class="review-judge-block">
  <span>Juiz 1: 8.5</span>
  <button class="btn btn-danger btn-sm" onclick="excluirNotaJuiz('juiz1')">Excluir</button>
</div>
<!-- Barra RPG interativa -->
<div id="rpgScoreBarContainer" style="margin-top:28px;max-width:430px;margin-left:auto;margin-right:auto;">
  <div style="font-size:17px;color:var(--gold2);margin-bottom:6px;">Resultado RPG</div>
  <div id="rpgScoreBar" style="height:26px;border-radius:8px;overflow:hidden;background:#222;border:1px solid var(--gold);position:relative;width:100%;">
    <div id="rpgScoreBarFill" style="height:100%;background:linear-gradient(90deg, #62d938 55%, #f2d452 80%, #d82525 100%);width:78%;"></div>
    <span id="rpgScoreBarLabel" style="position:absolute;top:0;left:0;width:100%;text-align:center;line-height:26px;font-weight:700;">7.8 / 10</span>
  </div>
  <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="exportaRpgBar()">Exportar imagem da barra</button>
</div>
<!-- Área participante: banner criativo -->
<div id="partRedesSociais" class="part-score-panel" style="margin-top:28px;max-width:420px;margin-left:auto;margin-right:auto;">
  <div style="font-size:16px;color:var(--gold2);margin-bottom:6px;">Compartilhe seu rendimento:</div>
  <div id="bannerRendimento" style="background:#222;border-radius:8px;padding:18px;text-align:center;max-width:400px;margin:0 auto 14px;">
    <div style="font-size:33px;color:var(--gold)">🥇</div>
    <div style="font-size:21px;color:var(--gold2);font-family:var(--font-display);">Nota: <span id="scoreSocial">8.7</span>/10</div>
    <div style="font-size:14px;color:var(--text3);margin:10px 0;">Classificação: <b id="classeSocial">Escritor Alquímico</b></div>
    <div class="alch-phrase" style="font-size:13px;" id="fraseAlquimicaSocial">"Transmutando palavras, você transforma destinos."</div>
  </div>
  <button class="btn btn-primary btn-sm" onclick="baixarBannerRendimento()">Baixar imagem</button>
</div>
<script>
function renderAdminScoreBox() {
  var isAdmin = (window._user?.role === 'Administrador');
  document.getElementById('adminFinalScoreBox').classList.toggle('hidden', !isAdmin);
}
function salvaNotaFinalAdmin() {
  const nota = Number(document.getElementById('adminFinalScoreInput').value);
  alert("Nota final salva: " + nota);
}
function excluirNotaJuiz(juizKey) {
  alert('Nota do ' + juizKey + ' excluída');
}
function setRpgBar(valor) {
  let pct = Math.max(0, Math.min(1, valor/10));
  let fill = document.getElementById('rpgScoreBarFill');
  let label = document.getElementById('rpgScoreBarLabel');
  fill.style.width = (pct*100) + "%";
  label.textContent = valor.toFixed(2) + " / 10";
}
function exportaRpgBar() {
  html2canvas(document.getElementById('rpgScoreBar')).then(canvas => {
    let a = document.createElement('a');
    a.href = canvas.toDataURL();
    a.download = "barra_nota_rpg.png";
    a.click();
  });
}
setRpgBar(7.8);
const frasesAlquimicas = [
  "Com tinta e papel, crio universos inteiros.",
  "Na forja das palavras, nascem novas realidades.",
  "Cada escrita é um experimento, cada texto, uma transmutação.",
  "Transmutando palavras, você transforma destinos.",
  "O escritor é o verdadeiro alquimista da imaginação."
];
function randomFraseAlquimica() {
  const i = Math.floor(Math.random() * frasesAlquimicas.length);
  document.getElementById('fraseAlquimicaSocial').textContent = '"' + frasesAlquimicas[i] + '"';
}
function baixarBannerRendimento() {
  randomFraseAlquimica();
  html2canvas(document.getElementById('bannerRendimento')).then(function(canvas) {
    let link = document.createElement('a');
    link.download = 'banner-rendimento.jpg';
    link.href = canvas.toDataURL("image/jpeg");
    link.click();
  });
}
randomFraseAlquimica();
</script>
</body>
</html>
